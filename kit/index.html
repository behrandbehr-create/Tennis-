<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tennis Leagues</title>
<meta http-equiv="refresh" content="0;url=league-hub/">
<style>
  :root { --green: #344f2c; --olive: #728728; --paper: #fbfaf7; --ink: #23261f; --muted: #6b6f64; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
         background: var(--paper); color: var(--ink);
         font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .box { max-width: 460px; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 8px; letter-spacing: -.01em; }
  p { color: var(--muted); margin: 0 0 20px; }
  a.go { display: inline-block; background: var(--green); color: #fff; text-decoration: none;
         padding: 13px 22px; border-radius: 999px; font-weight: 600; }
  a.go:hover { background: var(--olive); }
  small { display: block; margin-top: 22px; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
  <div class="box">
    <h1>Tennis Leagues</h1>
    <p>Taking you to the league list.</p>
    <a class="go" href="league-hub/">Open the league list</a>
    <small>If you meant to upload just the website, the file to drop on your host is
    <b>Tennis-League-Hub-DEPLOY.zip</b>. This page is here so the whole kit still works if you
    upload all of it.</small>
  </div>
</body>
</html>
